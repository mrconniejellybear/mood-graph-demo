<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Heatmap Scatterplot Prototype</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --grid-line: rgba(255, 255, 255, 0.05);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Card Container */
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .week-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Scatter Grid Layout */
    .scatter-wrapper {
      display: flex;
      gap: 8px;
    }

    .y-axis-labels {
      display: flex;
      flex-direction: column-reverse;
      justify-content: space-between;
      padding: 10px 0 32px 0;
      width: 80px;
    }

    .y-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      height: 36px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .grid-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chart-canvas {
      position: relative;
      height: 252px; /* 7 moods * 36px */
      border-left: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
    }

    /* Subtle grid lines */
    .grid-row-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--grid-line);
    }

    .grid-col-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--grid-line);
    }

    /* X Axis */
    .x-axis-labels {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding-top: 10px;
      text-align: center;
    }

    .x-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .x-label.today {
      color: #38bdf8;
    }

    /* Swarm Plot Dot Node */
    .scatter-dot {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .scatter-dot:hover {
      transform: translate(-50%, -50%) scale(1.25);
    }

    /* Interactive Testing Controls */
    .test-controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    select, button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    button.clear-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Weekly Mood Frequency</span>
        <span class="week-label">This Week</span>
      </div>

      <div class="scatter-wrapper">
        <div class="y-axis-labels" id="y-axis-labels"></div>

        <div class="grid-container">
          <div class="chart-canvas" id="chart-canvas"></div>
          <div class="x-axis-labels" id="x-axis-labels"></div>
        </div>
      </div>
    </div>

    <div class="test-controls">
      <div class="controls-title">Quick Log Tester</div>
      <div style="display: flex; gap: 8px;">
        <select id="day-select" style="flex: 1;"></select>
        <select id="mood-select" style="flex: 1.5;"></select>
      </div>
      <div class="btn-grid">
        <button id="add-log-btn">+ Log Mood Point</button>
        <button id="clear-btn" class="clear-btn">Clear Logs</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Mood Categories (Ordered visually from low-energy calm/down to high-energy/up)
    const MOOD_CATEGORIES = [
      { id: "exhausted", label: "Exhausted", color: "#64748b" },
      { id: "sad", label: "Sad", color: "#60a5fa" },
      { id: "anxious", label: "Anxious", color: "#f59e0b" },
      { id: "neutral", label: "Neutral", color: "#94a3b8" },
      { id: "calm", label: "Calm", color: "#34d399" },
      { id: "happy", label: "Happy", color: "#fbbf24" },
      { id: "excited", label: "Excited", color: "#f43f5e" }
    ];

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    // 2. Initial Sample Dataset with Multi-Logs
    let moodLogs = [
      { day: 0, moodId: "neutral" },
      { day: 1, moodId: "calm" },
      { day: 2, moodId: "anxious" },
      { day: 2, moodId: "anxious" }, // 2x on Wednesday -> larger dot
      { day: 3, moodId: "exhausted" },
      { day: 4, moodId: "happy" },
      { day: 4, moodId: "happy" },
      { day: 4, moodId: "happy" },   // 3x on Friday -> max glow & count badge
      { day: 5, moodId: "excited" },
      { day: 6, moodId: "calm" }
    ];

    const canvas = document.getElementById("chart-canvas");
    const yAxisContainer = document.getElementById("y-axis-labels");
    const xAxisContainer = document.getElementById("x-axis-labels");
    const daySelect = document.getElementById("day-select");
    const moodSelect = document.getElementById("mood-select");

    // Initialize Axes & Dropdown Options
    function initChartStructure() {
      // Build Y-Axis labels
      yAxisContainer.innerHTML = "";
      MOOD_CATEGORIES.forEach(m => {
        const lbl = document.createElement("div");
        lbl.className = "y-label";
        lbl.textContent = m.label;
        yAxisContainer.appendChild(lbl);
      });

      // Build X-Axis day labels
      xAxisContainer.innerHTML = "";
      DAYS.forEach((d, idx) => {
        const lbl = document.createElement("div");
        lbl.className = `x-label ${idx === 4 ? 'today' : ''}`; // e.g. Fri highlight
        lbl.textContent = d;
        xAxisContainer.appendChild(lbl);
      });

      // Populate Select Inputs
      DAYS.forEach((d, i) => daySelect.add(new Option(d, i)));
      MOOD_CATEGORIES.forEach(m => moodSelect.add(new Option(m.label, m.id)));
    }

    // Render Grid Lines & Frequency-Scaled Scatter Dots
    function renderScatterPlot() {
      canvas.innerHTML = "";

      const totalRows = MOOD_CATEGORIES.length;
      const totalCols = DAYS.length;

      // Draw horizontal guideline rows
      for (let r = 0; r < totalRows; r++) {
        const line = document.createElement("div");
        line.className = "grid-row-line";
        line.style.top = `${(r + 0.5) * (100 / totalRows)}%`;
        canvas.appendChild(line);
      }

      // Draw vertical day columns
      for (let c = 0; c < totalCols; c++) {
        const line = document.createElement("div");
        line.className = "grid-col-line";
        line.style.left = `${(c + 0.5) * (100 / totalCols)}%`;
        canvas.appendChild(line);
      }

      // Aggregate counts for same-day same-mood logs (Frequency Matrix)
      const counts = {};
      moodLogs.forEach(log => {
        const key = `${log.day}_${log.moodId}`;
        counts[key] = (counts[key] || 0) + 1;
      });

      // Render each aggregated data node
      Object.keys(counts).forEach(key => {
        const [dayStr, moodId] = key.split("_");
        const dayIdx = parseInt(dayStr, 10);
        const moodIdx = MOOD_CATEGORIES.findIndex(m => m.id === moodId);
        const count = counts[key];
        const moodMeta = MOOD_CATEGORIES[moodIdx];

        if (moodIdx === -1) return;

        const dot = document.createElement("div");
        dot.className = "scatter-dot";

        // Size scaling: 1 log = 18px, 2 logs = 26px, 3+ logs = 34px
        const baseSize = 18;
        const size = Math.min(baseSize + (count - 1) * 8, 36);
        
        // Halo glow intensity based on count
        const glowSpread = count * 6;
        const glowOpacity = Math.min(0.3 + count * 0.2, 0.9);

        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${(dayIdx + 0.5) * (100 / totalCols)}%`;
        dot.style.top = `${(totalRows - 1 - moodIdx + 0.5) * (100 / totalRows)}%`;
        dot.style.backgroundColor = moodMeta.color;
        dot.style.boxShadow = `0 0 ${glowSpread}px ${moodMeta.color}${Math.round(glowOpacity * 255).toString(16).padStart(2, '0')}`;
        
        // Show count number inside dot if > 1
        if (count > 1) {
          dot.textContent = count;
        }

        dot.title = `${moodMeta.label} logged ${count} time(s) on ${DAYS[dayIdx]}`;
        canvas.appendChild(dot);
      });
    }

    // Interaction Listeners
    document.getElementById("add-log-btn").addEventListener("click", () => {
      moodLogs.push({
        day: parseInt(daySelect.value, 10),
        moodId: moodSelect.value
      });
      renderScatterPlot();
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      moodLogs = [];
      renderScatterPlot();
    });

    // Boot up
    initChartStructure();
    renderScatterPlot();
  </script>
</body>
</html>
